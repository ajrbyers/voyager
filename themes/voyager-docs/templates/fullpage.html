<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title|striptags }} - {{ SITENAME }}</title>
{# Full-bleed reference mockups: the design system with no docs chrome.
   The page supplies its own example-banner (with a Back to Voyager link)
   and app header, exactly as a real Janeway screen would. #}
<link rel="stylesheet" href="{{ SITEURL }}/theme/voyager/assets/css/index.css">
<link rel="stylesheet" href="{{ SITEURL }}/theme/css/site.css">
<script type="module" src="{{ SITEURL }}/theme/voyager/assets/js/index.js"></script>
<script>(function(){var k='voyager-theme',d=window.matchMedia('(prefers-color-scheme: dark)').matches,t=null;try{t=localStorage.getItem(k)}catch(e){}document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));})();</script>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
{{ page.content }}
</body>
</html>
