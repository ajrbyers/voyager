[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janeway-voyager"
version = "0.1.0"
description = "Voyager - Janeway's design system, packaged as a Django app"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# jinja2 is a real runtime dependency: the packaged macros render through
# Django's Jinja2 template backend, which imports jinja2.
dependencies = ["Django>=4.2", "jinja2>=3.0"]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.urls]
Source = "https://github.com/openlibhums/voyager"

# The shippable files live at their canonical Django locations inside the
# package - voyager/static/voyager/... (css, js) and voyager/jinja2/voyager/...
# (macros) - so hatchling ships them as ordinary package data. No build hook,
# no symlinks: standard AppDirectoriesFinder and APP_DIRS Jinja resolve them.
[tool.hatch.build.targets.wheel]
packages = ["voyager"]

[tool.hatch.build.targets.sdist]
include = ["voyager", "README.md", "LICENSE", "CSS-ARCHITECTURE.md"]
